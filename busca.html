<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Cadastros - Feira das Profissões 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container container-busca">
    <div class="logo-header">
      <img src="logo.png" alt="Feira das Profissões 2026">
    </div>

    <h2>Consulta de Inscritos</h2>
    <p class="subtitulo">Pesquise por nome, escola ou WhatsApp para confirmar presença</p>

    <div class="busca-box">
      <input type="text" id="campoBusca" placeholder="Digite o nome, escola ou WhatsApp...">
      <button id="btnBuscar">Buscar</button>
    </div>

    <div id="resultadoArea"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxYoRQz2K2WGs5xGfT0bO0X5z_LmKaoZBAdcpcsFfHMJnwZKihal5N0E_8Rx96Y--a8/exec';

    const campoBusca = document.getElementById('campoBusca');
    const btnBuscar = document.getElementById('btnBuscar');
    const resultadoArea = document.getElementById('resultadoArea');

    function realizarBusca() {
      const termo = campoBusca.value.trim();
      if (!termo) return;

      btnBuscar.disabled = true;
      btnBuscar.innerText = 'Buscando...';
      resultadoArea.innerHTML = '<p class="sem-resultados">Pesquisando...</p>';

      fetch(`${APPS_SCRIPT_URL}?q=${encodeURIComponent(termo)}`, {
        method: 'GET',
        redirect: 'follow'
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success" && data.resultados && data.resultados.length > 0) {
          let html = `
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Escola</th>
                  <th>Curso</th>
                  <th>Período</th>
                  <th>Presença</th>
                  <th>Ação</th>
                </tr>
              </thead>
              <tbody>
          `;

          data.resultados.forEach(item => {
            const jaConfirmado = item.presenca === 'Confirmado';
            html += `
              <tr>
                <td>${item.nome}</td>
                <td>${item.escola}</td>
                <td>${item.curso}</td>
                <td>${item.periodo}</td>
                <td id="status-${item.linhaOriginal}">
                  ${jaConfirmado ? '<span class="status-ok">✔ Confirmado</span>' : 'Pendente'}
                </td>
                <td id="acao-${item.linhaOriginal}">
                  ${jaConfirmado 
                    ? '---' 
                    : `<button class="btn-confirmar" onclick="confirmarPresenca(${item.linhaOriginal})">Confirmar Presença</button>`
                  }
                </td>
              </tr>
            `;
          });

          html += '</tbody></table>';
          resultadoArea.innerHTML = html;
        } else {
          resultadoArea.innerHTML = '<p class="sem-resultados">Nenhum cadastro encontrado.</p>';
        }
      })
      .catch(err => {
        console.error('Erro:', err);
        resultadoArea.innerHTML = '<p class="sem-resultados" style="color:#ff6b6b;">Erro ao realizar a busca. Tente novamente.</p>';
      })
      .finally(() => {
        btnBuscar.disabled = false;
        btnBuscar.innerText = 'Buscar';
      });
    }

    function confirmarPresenca(linha) {
      const btn = event.target;
      btn.disabled = true;
      btn.innerText = 'Confirmando...';

      const formData = new URLSearchParams();
      formData.append('acao', 'confirmar_presenca');
      formData.append('linha', linha);

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById(`status-${linha}`).innerHTML = '<span class="status-ok">✔ Confirmado</span>';
        document.getElementById(`acao-${linha}`).innerHTML = '---';
      })
      .catch(err => {
        console.error(err);
        alert('Erro ao confirmar presença. Tente novamente.');
        btn.disabled = false;
        btn.innerText = 'Confirmar Presença';
      });
    }

    btnBuscar.addEventListener('click', realizarBusca);
    campoBusca.addEventListener('keypress', e => {
      if (e.key === 'Enter') realizarBusca();
    });
  </script>

</body>
</html>
